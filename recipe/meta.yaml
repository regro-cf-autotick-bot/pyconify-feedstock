{% set name = "pyconify" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pyconify-{{ version }}.tar.gz
  sha256: ec6dd6b95fb2b39d41ae96d8fd2015c182eb27c48381c926fd732d387e7ffbd9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - requests

test:
  imports:
    - pyconify
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: iconify API wrapper for python
  license: BSD-3-Clause
  license_file: LICENSE
  home: https://github.com/pyapp-kit/pyconify

extra:
  recipe-maintainers:
    - tlambert03
